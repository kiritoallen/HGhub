[package]
name = "hghub-web"
version = "1.2.1"
description = "HGhub HTTP 网页版：复用 src-tauri 的 Rust 核心，对外提供 HTTP API + HLS/封面代理"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[dependencies]
axum = "0.8"
# 除 axum 官方示例用的 rt-multi-thread/macros/net 外，复用进来的 src/net.rs、
# src/network_policy.rs 还用到 tokio::time::timeout/sleep，所以必须开 "time"
# （与 src-tauri/Cargo.toml 保持一致）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 与 src-tauri/Cargo.toml 完全一致：system-proxy 不能丢，否则客户端的流量
# 完全不看系统代理（见 src-tauri/src/net.rs 顶部说明）。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
time = { version = "0.3", features = ["formatting"] }
http = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
